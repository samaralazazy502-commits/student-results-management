
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة نتائج الطلاب</title>
<style>
body{font-family:Arial;background:lightgrey;padding:20px}
.container{max-width:800px;margin:auto;background:white;padding:20px;border-radius:10px}
h1{text-align:center;color:black}
input,button{padding:10px;margin:5px;border-radius:8px;border:1px solid grey}
button{background:blue;color:white;border:none;cursor:pointer}
button:hover{background:darkblue}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid lightgrey;padding:10px;text-align:center}
th{background:blue;color:white}
.del{background:red}
</style>
</head>
<body>
<div class="container">
<h1>إدارة نتائج الطلاب</h1>
<input id="name" placeholder="اسم الطالب">
<input id="subject" placeholder="المادة">
<input id="grade" placeholder="الدرجة" type="number">
<button onclick="addStudent()">إضافة</button>
<table>
<thead><tr><th>الاسم</th><th>المادة</th><th>الدرجة</th><th>حذف</th></tr></thead>
<tbody id="list"></tbody>
</table>
</div>
<script>
let students = JSON.parse(localStorage.getItem('students') || '[]');
function show(){
let list = document.getElementById('list');
list.innerHTML = '';
students.forEach((s,i)=>{
list.innerHTML += '<tr><td>'+s.name+'</td><td>'+s.subject+'</td><td>'+s.grade+'</td><td><button class="del" onclick="delStudent('+i+')">حذف</button></td></tr>';
});
}
function addStudent(){
let name = document.getElementById('name').value;
let subject = document.getElementById('subject').value;
let grade = document.getElementById('grade').value;
if(!name || !subject || !grade){alert('اكملي كل البيانات');return;}
students.push({name:name,subject:subject,grade:grade});
localStorage.setItem('students',JSON.stringify(students));
show();
}
function delStudent(i){students.splice(i,1);localStorage.setItem('students',JSON.stringify(students));show();}
show();
</script>
</body>
</html>
